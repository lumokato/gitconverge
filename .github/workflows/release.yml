name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: "0.2.0-rc.1"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and test installer
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\build-release.ps1 -Version "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: GitConverge-${{ needs.metadata.outputs.version }}-windows-x64
          path: |
            dist/GitConverge-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe
            dist/GitConverge-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe.sha256

  linux-amd64:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and test Linux archive
        shell: bash
        run: bash ./scripts/build-linux-release.sh "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: GitConverge-${{ needs.metadata.outputs.version }}-linux-amd64
          path: |
            dist/GitConverge-${{ needs.metadata.outputs.version }}-linux-amd64.tar.gz
            dist/GitConverge-${{ needs.metadata.outputs.version }}-linux-amd64.tar.gz.sha256

  macos-amd64:
    needs: metadata
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and test native Intel desktop
        run: bash ./scripts/build-macos-release.sh "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: GitConverge-${{ needs.metadata.outputs.version }}-macos-amd64
          path: |
            dist/GitConverge-${{ needs.metadata.outputs.version }}-macos-amd64.zip
            dist/GitConverge-${{ needs.metadata.outputs.version }}-macos-amd64.zip.sha256

  publish:
    if: github.event_name == 'push'
    needs:
      - metadata
      - windows-installer
      - linux-amd64
      - macos-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          version="${{ needs.metadata.outputs.version }}"
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            printf 'Expected six release assets, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets." >&2
            exit 1
          else
            gh release create "$tag" "${assets[@]}" --title "GitConverge $version" --generate-notes
          fi
