name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: "0.1.0-dev"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build and test installer
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\build-release.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: GitConverge-${{ steps.version.outputs.value }}-windows-x64
          path: |
            dist/GitConverge-${{ steps.version.outputs.value }}-windows-x64-setup.exe
            dist/GitConverge-${{ steps.version.outputs.value }}-windows-x64-setup.exe.sha256
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.value }}"
          $assets = @(
            ".\dist\GitConverge-$version-windows-x64-setup.exe",
            ".\dist\GitConverge-$version-windows-x64-setup.exe.sha256"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "GitConverge $version" --generate-notes
          }
